name: Release
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
jobs:
  linux-release:
    name: Versioned Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify compiler and compatibility tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Verify five Lua dialect smoke scenarios
        run: |
          cargo build --locked
          target/debug/fer tools/check_compat.lua
      - name: Enforce version-matched release and native graduation gates
        shell: bash
        env:
          FERRUA_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target/debug/fer tools/roadmap.lua --check
          target/debug/fer tools/roadmap.lua --release-gate "$FERRUA_RELEASE_TAG"
      - name: Build versioned binary and archive
        run: |
          cargo build --locked --release
          target/release/fer tools/package_release.lua "$GITHUB_REF_NAME"
      - name: Install and execute the exact tagged release artifact
        env:
          FERRUA_RELEASE_TARBALL: ${{ github.workspace }}/fer-${{ github.ref_name }}-linux-x86_64.tar.gz
        run: cargo test --locked --test installer installed_real_archive -- --nocapture
      - name: Verify tagged release archive in pinned Arch Linux userspace
        shell: bash
        env:
          FERRUA_ARCHIVE: fer-${{ github.ref_name }}-linux-x86_64.tar.gz
        run: |
          set -euo pipefail
          test -f "$FERRUA_ARCHIVE"
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work --env FERRUA_ARCHIVE \
            archlinux:base-20261011.0.609700 /bin/sh -ec '
              sha256sum --check "$FERRUA_ARCHIVE.sha256"
              mkdir -p /tmp/ferrua-archive-smoke
              tar -xzf "$FERRUA_ARCHIVE" -C /tmp/ferrua-archive-smoke fer
              /tmp/ferrua-archive-smoke/fer -e "print(6 * 7)" | grep -x 42
              /tmp/ferrua-archive-smoke/fer --check examples/process.lua
            '
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="fer-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          opts=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            opts+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$name" "$name.sha256" \
            --verify-tag \
            --title "Ferrua $GITHUB_REF_NAME" \
            --generate-notes "${opts[@]}"
