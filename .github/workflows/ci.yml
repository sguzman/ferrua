name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --all-targets
      - name: Lua roadmap integrity
        run: cargo run -- tools/roadmap.lua --check
      - name: Interpreter smoke
        run: |
          cargo run -- -e "print(6 * 7)" | grep -x 42
          printf 'print(6 * 7)\n' | cargo run -- -
          cargo run -- examples/count.lua | grep -x 55
          cargo run -- examples/process.lua | grep -x "process module smoke passed"
          cargo run -- --sandbox -e "assert(process == nil and __fer_process_run == nil)"
          cargo run -- --sandbox -e "assert(io == nil and os == nil)"
          cargo run -- --sandbox -e "assert(json.decode('{\"key\":42}').key == 42)"
          ! timeout 10s cargo run -- --budget=1000 -e "while true do end"
          printf 'answer=6*7\n=answer\n' | script -q -c "target/debug/fer" /dev/null | grep -Fq 42
      - name: Build release preview
        run: cargo build --release
      - name: Upload Linux preview binary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fer-linux-x86_64-preview
          path: target/release/fer
          if-no-files-found: error

  action-consumer:
    name: Composite action consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./
      - name: Run fer from PATH
        shell: bash
        run: |
          command -v fer
          fer examples/count.lua | grep -x 55
          fer examples/process.lua | grep -x "process module smoke passed"
          fer --sandbox -e "assert(process == nil and __fer_process_run == nil)"
