name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ferrua-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust dependency and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ferrua-linux-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --all-targets
      - name: Lua roadmap integrity
        run: cargo run --locked -- tools/roadmap.lua --check
      - name: Engine graduation and release safety guards
        run: cargo run --locked -- tools/roadmap.lua --self-test-gates
      - name: JSON conformance matrix
        run: |
          cargo run --locked -- tests/json_spec.lua | grep -x "JSON conformance smoke passed"
          cargo run --locked -- --lua=5.4 tests/json_spec.lua | grep -x "JSON conformance smoke passed"
          cargo run --locked -- --sandbox tests/json_spec.lua | grep -x "JSON conformance smoke passed"
          cargo run --locked -- --lua=5.1 --sandbox tests/json_spec.lua | grep -x "JSON conformance smoke passed"
      - name: Lua 5.1-5.5 automated dialect matrix
        run: cargo run --locked -- tools/check_compat.lua | grep -x "Ferrua Lua dialect matrix passed"
      - name: Interpreter smoke
        run: |
          cargo run --locked -- -e "print(6 * 7)" | grep -x 42
          printf 'print(6 * 7)\n' | cargo run --locked -- -
          cargo run --locked -- examples/count.lua | grep -x 55
          cargo run --locked -- --check tests/data.lua
          cargo run --locked -- --check examples/process.lua
          ! cargo run --locked -- --check -e "local ="
          cargo run --locked -- tests/data.lua | grep -x "TOML and YAML smoke passed"
          cargo run --locked -- examples/process.lua | grep -x "process module smoke passed"
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          cargo run --locked -- examples/fs.lua "$scratch_dir" | grep -x "filesystem module smoke passed"
          cargo run --locked -- --sandbox -e "assert(process == nil and __fer_process_run == nil and fs == nil and __fer_fs_call == nil)"
          cargo run --locked -- --sandbox -e "assert(io == nil and os == nil)"
          cargo run --locked -- --sandbox -e 'assert(json.decode([[{"key":42}]]).key == 42)'
          ! timeout 10s cargo run --locked -- --budget=1000 -e "while true do end"
          printf 'answer=6*7\n=answer\n' | script -q -c "target/debug/fer" /dev/null | grep -Fq 42
      - name: Build release preview
        run: |
          cargo build --locked --release
          (cd target/release && sha256sum fer > fer.sha256)
      - name: Validate Linux release binary on isolated Arch userspace
        shell: bash
        run: |
          set -euo pipefail
          # Official Arch Linux base image, date-pinned for reproducible CI.
          # Container smoke is not native EndeavourOS or Hyprland acceptance.
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work \
            archlinux:base-20261011.0.609700 /bin/sh -ec '
              ./target/release/fer -e "print(6 * 7)" | grep -x 42
              ./target/release/fer examples/count.lua | grep -x 55
              ./target/release/fer --check examples/process.lua
              ./target/release/fer --sandbox -e "assert(io == nil and os == nil and process == nil)"
              ./target/release/fer -e "assert(json.decode(\"{\\\"key\\\":42}\").key == 42)"
            '
      - name: Validate Lua-driven release packaging
        run: target/release/fer tools/package_release.lua
      - name: Verify packaged Linux archive inside isolated Arch userspace
        shell: bash
        run: |
          set -euo pipefail
          archives=(fer-v*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,size=64m \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work --env "FERRUA_ARCHIVE=${archives[0]}" \
            archlinux:base-20261011.0.609700 /bin/sh -ec '
              sha256sum --check "$FERRUA_ARCHIVE.sha256"
              mkdir -p /tmp/ferrua-archive-smoke
              tar -xzf "$FERRUA_ARCHIVE" -C /tmp/ferrua-archive-smoke fer
              test -x /tmp/ferrua-archive-smoke/fer
              /tmp/ferrua-archive-smoke/fer -e "print(6 * 7)" | grep -x 42
              /tmp/ferrua-archive-smoke/fer --check examples/process.lua
              /tmp/ferrua-archive-smoke/fer --sandbox -e "assert(io == nil and os == nil)"
            '
      - name: Install and run actual Linux archive outside checkout
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(fer-v*-linux-x86_64.tar.gz)
          test "${#artifacts[@]}" -eq 1
          FERRUA_RELEASE_TARBALL="$PWD/${artifacts[0]}" \
            cargo test --locked --test installer installed_real_archive -- --nocapture
      - name: Upload Linux preview binary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fer-linux-x86_64-preview
          path: |
            target/release/fer
            target/release/fer.sha256
            fer-*-linux-x86_64.tar.gz
            fer-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  action-consumer:
    timeout-minutes: 25
    name: Composite action consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./
      - name: Run fer from PATH
        shell: bash
        run: |
          command -v fer
          fer examples/count.lua | grep -x 55
          fer tests/data.lua | grep -x "TOML and YAML smoke passed"
          fer examples/process.lua | grep -x "process module smoke passed"
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          fer examples/fs.lua "$scratch_dir" | grep -x "filesystem module smoke passed"
          fer --sandbox -e "assert(process == nil and __fer_process_run == nil)"

  reference-conformance:
    timeout-minutes: 20
    name: Lua 5.4 differential smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Lua 5.4 reference interpreter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -v
      - name: Build pinned Ferrua interpreter
        run: cargo build --locked
      - name: Compare deterministic Lua fixture output
        run: target/debug/fer tools/diff_lua.lua | grep -x "Ferrua vs Lua 5.4 differential smoke passed"
      - name: Compare experimental integer register IR against upstream Lua
        env:
          FERRUA_COMPARE_OWNED_WITH_LUA: "1"
        run: cargo test --locked --test owned_vm -- --nocapture
      - name: Compare bounded integer control flow with upstream Lua
        env:
          FERRUA_COMPARE_OWNED_WITH_LUA: "1"
        run: cargo test --locked --test owned_flow -- --nocapture
      - name: Compare owned short-string escape syntax with upstream Lua
        env:
          FERRUA_COMPARE_OWNED_WITH_LUA: "1"
        run: cargo test --locked --test owned_syntax -- --nocapture
      - name: Compare owned CLI interactions with upstream Lua
        env:
          FERRUA_COMPARE_OWNED_WITH_LUA: "1"
        run: cargo test --locked --test owned_cli_differential -- --nocapture

  msrv:
    timeout-minutes: 20
    name: Rust 1.96 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Restore Rust MSRV cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ferrua-msrv-1.96-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build pinned dependencies on MSRV
        run: cargo build --locked

  acceptance-status:
    name: Publish CI acceptance status
    needs: [linux, action-consumer, reference-conformance, msrv]
    if: ${{ always() && github.event_name == 'push' }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record aggregate four-job result for main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          LINUX_RESULT: ${{ needs.linux.result }}
          CONSUMER_RESULT: ${{ needs['action-consumer'].result }}
          REFERENCE_RESULT: ${{ needs['reference-conformance'].result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          set -euo pipefail
          state=failure
          message="Ferrua CI: one or more primary jobs did not pass"
          if [[ "$LINUX_RESULT" == success && "$CONSUMER_RESULT" == success && "$REFERENCE_RESULT" == success && "$MSRV_RESULT" == success ]]; then
            state=success
            message="All four Ferrua acceptance jobs passed"
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$GH_SHA" \
            -f state="$state" \
            -f context="ferrua/ci" \
            -f description="$message" \
            -f target_url="https://github.com/$GH_REPO/actions/runs/$GH_RUN_ID" >/dev/null
          [[ "$state" == success ]]
