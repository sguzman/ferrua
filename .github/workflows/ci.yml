name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust dependency and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ferrua-linux-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --all-targets
      - name: Lua roadmap integrity
        run: cargo run --locked -- tools/roadmap.lua --check
      - name: JSON conformance matrix
        run: |
          cargo run --locked -- tests/json_spec.lua | grep -x "JSON conformance smoke passed"
          cargo run --locked -- --lua=5.4 tests/json_spec.lua | grep -x "JSON conformance smoke passed"
          cargo run --locked -- --sandbox tests/json_spec.lua | grep -x "JSON conformance smoke passed"
          cargo run --locked -- --lua=5.1 --sandbox tests/json_spec.lua | grep -x "JSON conformance smoke passed"
      - name: Interpreter smoke
        run: |
          cargo run --locked -- -e "print(6 * 7)" | grep -x 42
          printf 'print(6 * 7)\n' | cargo run --locked -- -
          cargo run --locked -- examples/count.lua | grep -x 55
          cargo run --locked -- --check tests/data.lua
          cargo run --locked -- --check examples/process.lua
          ! cargo run --locked -- --check -e "local ="
          cargo run --locked -- tests/data.lua | grep -x "TOML and YAML smoke passed"
          cargo run --locked -- examples/process.lua | grep -x "process module smoke passed"
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          cargo run --locked -- examples/fs.lua "$scratch_dir" | grep -x "filesystem module smoke passed"
          cargo run --locked -- --sandbox -e "assert(process == nil and __fer_process_run == nil and fs == nil and __fer_fs_call == nil)"
          cargo run --locked -- --sandbox -e "assert(io == nil and os == nil)"
          cargo run --locked -- --sandbox -e "assert(json.decode('{\"key\":42}').key == 42)"
          ! timeout 10s cargo run --locked -- --budget=1000 -e "while true do end"
          printf 'answer=6*7\n=answer\n' | script -q -c "target/debug/fer" /dev/null | grep -Fq 42
      - name: Build release preview
        run: |
          cargo build --locked --release
          (cd target/release && sha256sum fer > fer.sha256)
      - name: Validate Lua-driven release packaging
        run: target/release/fer tools/package_release.lua
      - name: Upload Linux preview binary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fer-linux-x86_64-preview
          path: |
            target/release/fer
            target/release/fer.sha256
            fer-*-linux-x86_64.tar.gz
            fer-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  action-consumer:
    name: Composite action consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./
      - name: Run fer from PATH
        shell: bash
        run: |
          command -v fer
          fer examples/count.lua | grep -x 55
          fer tests/data.lua | grep -x "TOML and YAML smoke passed"
          fer examples/process.lua | grep -x "process module smoke passed"
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          fer examples/fs.lua "$scratch_dir" | grep -x "filesystem module smoke passed"
          fer --sandbox -e "assert(process == nil and __fer_process_run == nil)"

  msrv:
    name: Rust 1.96 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Restore Rust MSRV cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ferrua-msrv-1.96-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build pinned dependencies on MSRV
        run: cargo build --locked
