name: Setup Ferrua
description: Install the fer Lua interpreter from this action's Rust source
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build and install fer
      shell: bash
      env:
        FERRUA_SOURCE_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cargo install --path "$FERRUA_SOURCE_DIR" --root "$RUNNER_TEMP/ferrua" --force
        echo "$RUNNER_TEMP/ferrua/bin" >> "$GITHUB_PATH"
    - name: Verify interpreter
      shell: bash
      run: |
        "$RUNNER_TEMP/ferrua/bin/fer" --version
        "$RUNNER_TEMP/ferrua/bin/fer" -e "assert(6 * 7 == 42)"
